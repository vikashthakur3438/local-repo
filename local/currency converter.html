<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>

    <!-- Corrected stylesheet spelling -->
    <link rel="stylesheet" href="currency converter.css" />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
</head>

<body>

    <div class="container">

        <h2>Currency Converter</h2>

        <form>

            <div class="amount">
                <p>Enter the Amount</p>

                <!-- Removed comma -->
                <input type="text" value="100" />
            </div>

            <div class="dropdown">

                <!-- FROM -->
                <div class="from">

                    <p>From</p>

                    <!-- class instead of name -->
                    <div class="select-container">

                        <img src="https://flagsapi.com/US/flat/64.png" />

                        <select name="from">
                        </select>

                    </div>
                </div>

                <!-- ICON -->
                <i class="fa-solid fa-arrow-right-arrow-left"></i>

                <!-- TO -->
                <div class="to">

                    <p>To</p>

                    <div class="select-container">

                        <img src="https://flagsapi.com/IN/flat/64.png" />

                        <select name="to">
                        </select>

                    </div>
                </div>

            </div>

            <div class="msg">1 USD = 80 INR</div>

            <button>Get Exchange Rate</button>

        </form>

    </div>
<script src="countrylist.js"></script>
<script src="currency converter.js"></script>
</body>
</html>
